<!doctype html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kdo má pravdu? Soutěž</title>
<style>
:root{--bg:#12263A;--card:#1B3550;--ink:#fff;--dark:#1B2430;--teal:#2EC4B6;--orange:#FF9F1C;--red:#E63946;--yellow:#FFE8A3;--green:#3DDC84;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 Calibri,"Segoe UI",system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font:700 26px Cambria,Georgia,serif;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:20px;padding:4px 12px;font-weight:700;color:var(--orange)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0}
.zad{background:var(--yellow);color:var(--dark);border-radius:14px;padding:12px 16px;font-size:19px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
@media(max-width:620px){.duo{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;align-items:center}
.bub{background:#fff;color:var(--dark);border-radius:22px;padding:16px 18px;width:100%;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.35);min-height:96px;display:flex;align-items:center}
.bub:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-14px;border:14px solid transparent;border-bottom:0;border-top-color:#fff}
.av{width:84px;height:84px;margin-top:16px}
.lbl{font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:16px 10px;color:var(--dark);background:var(--teal);cursor:pointer;min-height:56px}
button.o{background:var(--orange)}button.y{background:var(--yellow)}button.g{background:#C9D6E2}button.t{background:#fff;padding:12px 22px}
button:disabled{opacity:.45;cursor:default}
.sel{outline:4px solid #fff}
input{font:inherit;padding:14px;border-radius:12px;border:0;width:100%;max-width:340px}
.ok{color:var(--green)}.bad{color:#FF8A94}
.row{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px}
.row:nth-child(odd){background:rgba(255,255,255,.07)}.me{outline:2px solid var(--orange)}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--orange);width:100%}
.dist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.dist b{display:block;font-size:26px}
.hide{display:none}
</style></head><body><main>
<div class="top"><h1>🚗 Kdo má pravdu?</h1><span class="chip" id="chip"></span></div>
<div id="v"></div>
</main>
<script>
const TASKS=[{"lvl": 3, "zad": "Chladicí soustava pojme 8 l a je naplněná z 3/4. Doplníme 1,25 l. Kolik litrů ještě chybí do plna?", "n1": "Adam", "t1": "„3/4 z 8 je 6 l. 6 + 1,25 = 7,25 l, takže chybí 0,75 l.“", "n2": "Bára", "t2": "„3/4 z 8 je 6 l, do plna chybí 2 l. Doplnili jsme 1,25 l, takže chybí 2 − 1,25 = 1,25 l.“"}, {"lvl": 3, "zad": "Auto spotřebuje 5,4 l na 100 km. Kolik litrů spotřebuje na 250 km?", "n1": "Cyril", "t1": "„5,4 · 2,5 = 10,8 + 2,7 = 13,5 l.“", "n2": "Dana", "t2": "„5,4 · 250 = 1 350, posunu čárku o dvě místa: 13,5 l.“"}, {"lvl": 3, "zad": "Mechanik má 4,5 l oleje a plní nádobky po 3/8 l. Kolik nádobek naplní?", "n1": "Emil", "t1": "„3/8 = 0,375 l. 4,5 : 0,375 = 4 500 : 375 = 12 nádobek.“", "n2": "Fanda", "t2": "„4,5 = 9/2. Dělení: převrátím první zlomek, 2/9 · 3/8 = 6/72 = 1/12 nádobky.“"}, {"lvl": 3, "zad": "Sada pneumatik stojí 12 480 Kč. Prodejce dá slevu 1/8 z ceny. Kolik zaplatíme po slevě?", "n1": "Honza", "t1": "„1/8 je 0,18, sleva je 12 480 · 0,18 = 2 246,40 Kč. Zaplatíme 10 233,60 Kč.“", "n2": "Gustav", "t2": "„1/8 z 12 480 je 1 560 Kč, zaplatíme 12 480 − 1 560 = 10 920 Kč.“"}, {"lvl": 3, "zad": "Brzdový kotouč má tloušťku 2,2 cm. Minimální tloušťka je 20,5 mm. Kolik mm se smí kotouč ještě sjet?", "n1": "Ivo", "t1": "„2,2 cm je 22 mm. 22 − 20,5 = 1,5 mm.“", "n2": "Jana", "t2": "„20,5 mm je 2,5 cm, takže 2,2 − 2,5 = −0,3 cm. Kotouč je už pod minimem.“"}, {"lvl": 3, "zad": "Auto jelo 45 minut rychlostí 80 km/h a potom čtvrt hodiny rychlostí 60 km/h. Kolik km ujelo celkem?", "n1": "Karel", "t1": "„0,45 h · 80 = 36 km, čtvrt hodiny 0,25 · 60 = 15 km. Celkem 51 km.“", "n2": "Lída", "t2": "„45 minut je 3/4 h: 3/4 · 80 = 60 km. Čtvrt hodiny: 15 km. Celkem 75 km.“"}, {"lvl": 3, "zad": "Šroub je dlouhý 2 3/8 palce a vrták 1 3/4 palce. O kolik palců je šroub delší?", "n1": "Adam", "t1": "„2 − 1 = 1. Z 3/8 a 3/4: 3/4 − 3/8 = 3/8. Rozdíl je 1 3/8 palce.“", "n2": "Bára", "t2": "„2 3/8 = 19/8, 1 3/4 = 14/8. Rozdíl je 5/8 palce.“"}, {"lvl": 3, "zad": "Mechanik smíchal 0,6 l a 1/4 l přísady. Kolik litrů je dohromady?", "n1": "Cyril", "t1": "„0,6 + 0,25 = 0,31 l.“", "n2": "Dana", "t2": "„0,6 = 3/5 = 12/20 a 1/4 = 4/20, takže 16/20 = 4/5 l.“"}, {"lvl": 3, "zad": "Z cívky s 7,5 m kabelu stříháme kousky po 0,3 m. Kolik kousků dostaneme?", "n1": "Petr", "t1": "„7,5 : 0,3 = 75 : 3 = 25 kousků, nic nezbude.“", "n2": "Eva", "t2": "„7,5 : 0,3 = 2,5 kousku, zbude půl kousku.“"}, {"lvl": 3, "zad": "Olejový filtr stojí 189 Kč a litr oleje 349,90 Kč. Kolik zaplatíme za filtr a 4,5 l oleje?", "n1": "Honza", "t1": "„349,90 · 4 = 1 399,60 a 349,90 · 0,5 = 17,495, to je 1 417,10 Kč. S filtrem 1 606,10 Kč.“", "n2": "Gustav", "t2": "„Odhad: 350 · 4,5 = 1 575 a 189, dohromady 1 764 Kč. Přesně 1 763,55 Kč.“"}, {"lvl": 3, "zad": "Plechovka barvy má 2,5 kg. Dílna spotřebovala 2/5 barvy a pak ještě 0,3 kg. Kolik kg barvy zbylo?", "n1": "Ivo", "t1": "„2/5 z 2,5 je 2,5 : 2 = 1,25 kg. Dohromady 1,55 kg, zbylo 0,95 kg.“", "n2": "Jana", "t2": "„2/5 z 2,5 je 2,5 : 5 = 0,5 kg. Spotřeba 0,5 + 0,3 = 0,8 kg, zbylo 1,7 kg.“"}, {"lvl": 3, "zad": "Litr nafty stojí 37,80 Kč. Do nádrže o objemu 56 l natankujeme 1/4 nádrže. Kolik zaplatíme?", "n1": "Karel", "t1": "„1/4 z 56 je 14 l. 14 · 37,80 = 529,20 Kč.“", "n2": "Lída", "t2": "„56 : 4 = 14 l. 14 · 37,8 = 14 · 38 − 14 · 2 = 532 − 28 = 504 Kč.“"}, {"lvl": 3, "zad": "Motor spotřebuje 0,25 l oleje na 1 000 km. Kolik litrů spotřebuje na 2 500 km?", "n1": "Petr", "t1": "„0,25 · 2,5 = 0,0625 l.“", "n2": "Eva", "t2": "„Na 2 000 km je to 0,5 l a na 500 km dalších 0,25 l, dohromady 0,75 l.“"}, {"lvl": 3, "zad": "Nádrž má 60 l. Auto ujelo 2/3 trasy a spotřebovalo 3/5 nádrže. Kolik litrů spotřebuje na celou trasu?", "n1": "Adam", "t1": "„3/5 z 60 je 36 l. To je 2/3 trasy, celá trasa je 36 · 3/2 = 54 l.“", "n2": "Bára", "t2": "„36 l je 2/3 trasy, takže celá trasa je 36 · 2/3 = 24 l.“"}, {"lvl": 3, "zad": "Ze 3 m profilu odřežeme 3/8 m a potom ještě 0,45 m. Kolik metrů zbývá?", "n1": "Gustav", "t1": "„Odřezáno je 0,375 + 0,45 = 0,825 m. Zbývá 3 − 0,825 = 2,175 m.“", "n2": "Honza", "t2": "„3 − 3/8 = 2 5/8 = 2,625 m. Odečtu 0,45: 2,625 − 0,45 = 2,175 m.“"}, {"lvl": 3, "zad": "Plech má rozměry 1,2 m a 0,75 m. Vyřízneme z něj čtverec o straně 0,5 m. Kolik m² plechu zbude?", "n1": "Dana", "t1": "„0,5 · 0,5 = 0,025 m². Zbývá 0,9 − 0,025 = 0,875 m².“", "n2": "Cyril", "t2": "„1,2 · 0,75 = 0,9 m², čtverec 0,5 · 0,5 = 0,25 m². Zbývá 0,65 m².“"}, {"lvl": 3, "zad": "Po ujetí 3/5 trasy zbývá do cíle 120 km. Jak dlouhá je celá trasa?", "n1": "Emil", "t1": "„2/5 trasy je 120 km, 1/5 je 60 km, celá trasa je 60 · 3 = 180 km.“", "n2": "Fanda", "t2": "„3/5 trasy je 120 km, 1/5 je 40 km, takže celá trasa je 200 km.“"}, {"lvl": 3, "zad": "Oprava jednoho vozu trvá 3/4 hodiny. Kolik vozů se opraví za 6 hodin?", "n1": "Ivo", "t1": "„3/4 = 0,75 a 6 : 0,75 = 0,8 vozu.“", "n2": "Jana", "t2": "„6 : 3/4 = 6 · 4/3 = 24/3 = 8 vozů.“"}, {"lvl": 3, "zad": "Nádrž pojme 55 l. Zbývá v ní 1/5 nádrže a dotankujeme 0,7 nádrže. Kolik litrů paliva je teď v nádrži?", "n1": "Karel", "t1": "„1/5 je 0,5, takže 0,5 + 0,7 = 1,2 nádrže. Nádrž je plná, tedy 55 l.“", "n2": "Lída", "t2": "„1/5 + 0,7 = 1/5 + 7/10 = 8/15 nádrže. 8/15 z 55 je asi 29 l.“"}, {"lvl": 3, "zad": "V 2,4 l směsi je 1/6 aditiva. Kolik litrů aditiva je ve směsi?", "n1": "Petr", "t1": "„2,4 : 6 = 0,04 l.“", "n2": "Eva", "t2": "„1/6 = 0,6, takže 2,4 · 0,6 = 1,44 l.“"}];
const FEM=["Bára","Dana","Eva","Jana","Lída"],SK=["F2C6A0","D9A27A","A66E4B","FFDDBF"],HR=["2B2118","6B4423","C98B2B","1F2937","8C3B2E"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S=null,teacher=location.pathname.startsWith("/ucitel"),pass="",authed=false,shownAt=0,lastKey="",tick=null,id="";
try{pass=sessionStorage.getItem("kmp-pw")||"";id=localStorage.getItem("kmp-id")||"";
  if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()).replace(/[^\w-]/g,"").slice(0,64);localStorage.setItem("kmp-id",id)}}
catch(e){id=(Date.now()+"-"+Math.random()).replace(/[^\w-]/g,"")}
const api=(u,b)=>fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()).catch(()=>({ok:false}));
const act=a=>api("/api/teacher",{password:pass,action:a});

function avatar(name,col,seed){
  const sk=SK[seed%4],hr=HR[(seed*3+1)%5],f=FEM.includes(name),cap=!f&&seed%2===0,top=cap?"#E63946":"#"+hr;
  return `<svg viewBox="0 0 100 100" class="av" aria-hidden="true">${f?`<rect x="26" y="14" width="48" height="54" rx="22" fill="#${hr}"/>`:""}<path d="M12 100V86a18 18 0 0 1 18-18h40a18 18 0 0 1 18 18v14z" fill="#${col}"/><rect x="43" y="56" width="14" height="16" fill="#${sk}"/><circle cx="50" cy="40" r="22" fill="#${sk}"/><path d="M27 38C27 20 38 14 50 14S73 20 73 38C66 30 34 30 27 38Z" fill="${top}"/>${cap?`<rect x="48" y="30" width="30" height="5" rx="2" fill="${top}"/>`:""}<circle cx="41" cy="42" r="2.6" fill="#1B2430"/><circle cx="59" cy="42" r="2.6" fill="#1B2430"/><ellipse cx="50" cy="52" rx="6" ry="2.6" fill="#B23A48"/></svg>`;
}
function cartoon(t,i){
  return `<div class="zad"><b>Zadání:</b> ${t.zad}</div><div class="duo">
  <div class="side"><div class="bub">${t.t1}</div>${avatar(t.n1,"2EC4B6",i*2)}<div class="lbl">A: ${t.n1}</div></div>
  <div class="side"><div class="bub">${t.t2}</div>${avatar(t.n2,"FF9F1C",i*2+1)}<div class="lbl">B: ${t.n2}</div></div></div>`;
}
function lbHtml(n){
  const arr=[...S.players].sort((a,b)=>b.s-a.s);
  const rows=arr.slice(0,n).map((p,k)=>`<div class="row${p.id===id?" me":""}"><span>${k+1}. ${esc(p.name)}</span><b>${p.s}</b></div>`);
  const k=arr.findIndex(p=>p.id===id);
  if(k>=n)rows.push(`<div class="row me"><span>${k+1}. ${esc(arr[k].name)}</span><b>${arr[k].s}</b></div>`);
  return rows.join("")||"<i>Zatím nikdo.</i>";
}
const label=(t,a)=>({AB:"Pravdu mají oba (A i B)",N:"Nemá pravdu nikdo",A:"Pravdu má A – "+t.n1,B:"Pravdu má B – "+t.n2}[a]);
const opts=t=>[["A","A: "+t.n1,""],["B","B: "+t.n2,"o"],["AB","A i B","y"],["N","Ani jeden","g"]];

function build(){
  if(!S)return `<div class="card">Připojuji se… (první načtení po delší pauze může trvat až minutu)</div>`;
  if(teacher&&!authed)return `<div class="card"><h2>Přihlášení učitele</h2><input id="pw" type="password" placeholder="Heslo"><div style="margin-top:12px"><button class="t" id="lg">Přihlásit</button></div></div>`;
  const i=S.idx,t=TASKS[i],ph=S.phase,m=S.mine,N=TASKS.length,r=S.reveal;
  if(ph==="end")return `<div class="card"><h2>🏆 Konečné pořadí</h2><div id="lb"></div></div>`+(teacher?`<button class="t" id="nw">Nová hra (smaže hráče)</button>`:"");
  if(teacher&&ph==="lobby")return `<div class="card"><h2>Čekárna</h2><p>Žáci otevřou hlavní adresu stránky a zadají jméno. Připojeno: <b id="cnt">0</b></p><div id="lb"></div></div><button class="t" id="go">Spustit hru (${N} úloh)</button>`;
  if(!m&&!teacher)return `<div class="card"><h2>Připoj se</h2><p>Zadej přezdívku (stačí jméno).</p><input id="nm" maxlength="20" placeholder="Jméno"><div style="margin-top:12px"><button class="t" id="jn">Připojit se</button></div></div>`;
  if(!teacher&&ph==="lobby")return `<div class="card"><h2>Ahoj ${esc(m.name)}!</h2><p>Čekej, až učitel spustí hru. Připojeno: <b id="cnt">0</b></p></div>`;
  const head=`<div class="top"><span class="chip">Úloha ${i+1} / ${N}</span><span class="chip">${"●".repeat(t.lvl)}${"○".repeat(3-t.lvl)}</span></div>`;
  if(ph==="question"){
    let body="";
    if(teacher)body=`<div class="card">Odpovědělo <b id="ans">0</b> z <b id="cnt">0</b></div><button class="t" id="rv">Odhalit odpověď</button>`;
    else if(m.answer)body=`<div class="card">Tvoje odpověď: <b>${esc(opts(t).find(o=>o[0]===m.answer)[1])}</b>. Čekej na odhalení.</div>`;
    else body=`<div class="bar"><i id="tm"></i></div><div class="btns">${opts(t).map(o=>`<button class="${o[2]}" data-c="${o[0]}">${esc(o[1])}</button>`).join("")}</div>`;
    return head+cartoon(t,i)+body;
  }
  const res=teacher?"":m.answer?(m.answer===r.ans?`<p class="ok"><b>Správně! +${m.pts} b.</b></p>`:`<p class="bad"><b>Tentokrát ne.</b> 0 b.</p>`):`<p class="bad">Neodpověděl/a jsi. 0 b.</p>`;
  return head+`<div class="card"><h2 class="ok">${label(t,r.ans)}</h2>${res}<p><b>Správný výsledek:</b> ${r.res}</p>${teacher?'<div class="dist" id="dist"></div>':""}</div>`+
    `<div class="card"><h3>Pořadí</h3><div id="lb"></div></div>`+
    (teacher?(i+1<N?`<button class="t" id="nx">Další úloha</button>`:`<button class="t" id="en">Ukončit a ukázat pořadí</button>`):"");
}
function refresh(){
  const set=(s,h)=>{const e=$(s);if(e)e.innerHTML=h};
  set("#cnt",S.players.length);set("#lb",lbHtml(teacher||S.phase==="end"?10:5));
  set("#ans",S.players.filter(p=>p.a).length);
  if(S.dist){const t=TASKS[S.idx];set("#dist",opts(t).map(o=>`<div><b>${S.dist[o[0]]}</b>${esc(o[1])}${o[0]===S.reveal.ans?" ✓":""}</div>`).join(""))}
}
function render(){
  if(S){const m=S.mine;
    const key=[S.phase,S.idx,m?1:0,m&&m.answer?1:0,authed].join("|");
    if(key!==lastKey){lastKey=key;if(S.phase==="question")shownAt=Date.now();
      $("#v").innerHTML=build();bind();clearInterval(tick);
      if(S.phase==="question"&&$("#tm"))tick=setInterval(()=>{const e=$("#tm");if(e)e.style.width=Math.max(0,100-(Date.now()-shownAt)/300)+"%"},200)}
    $("#chip").textContent=teacher?"Učitel":m?m.name+" · "+m.total+" b.":"";
    refresh();
  }else $("#v").innerHTML=build();
}
function bind(){
  const on=(s,f)=>{const e=$(s);if(e)e.onclick=f};
  on("#go",()=>act("start"));on("#rv",()=>act("reveal"));on("#nx",()=>act("next"));on("#en",()=>act("end"));
  on("#lg",async()=>{pass=$("#pw").value;const r=await act("check");
    if(r.ok){authed=true;try{sessionStorage.setItem("kmp-pw",pass)}catch(e){}render()}else alert("Špatné heslo.")});
  const nw=$("#nw");
  if(nw)nw.onclick=()=>{if(nw.dataset.s!=="1"){nw.dataset.s="1";nw.textContent="Opravdu? Klikni znovu";return}act("reset")};
  on("#jn",async()=>{const n=($("#nm").value||"").trim().slice(0,20);if(!n)return;
    const r=await api("/api/join",{id,name:n});if(!r.ok)alert("Připojení se nepodařilo, zkus to znovu.")});
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("[data-c]").forEach(x=>x.disabled=true);b.classList.add("sel");
    api("/api/answer",{id,c:b.dataset.c});
  });
}
(async()=>{
  $("#v").innerHTML=build();
  if(teacher&&pass){const r=await act("check");authed=!!r.ok}
  const es=new EventSource("/api/events?id="+encodeURIComponent(id));
  es.onmessage=e=>{S=JSON.parse(e.data);render()};
})();
</script></body></html>
